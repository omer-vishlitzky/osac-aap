---
# Wait for all ClusterOperators to reach Available=True.
# Logs which operators are unavailable on each poll iteration so that
# timeout failures produce actionable diagnostics instead of bare
# "FAILED - RETRYING" lines.
#
# Required vars:
#   wait_for_kubeconfig: kubeconfig for the managed cluster

- name: Initialize CO wait state
  ansible.builtin.set_fact:
    wait_for_co_all_available: false
    wait_for_co_attempts: 0
    wait_for_co_max_retries: "{{ wait_for_clusteroperators_retries | int }}"
    wait_for_co_delay: "{{ wait_for_clusteroperators_delay | int }}"

- name: Poll ClusterOperators until all available
  ansible.builtin.include_tasks: _poll_cluster_operators.yaml
  loop: "{{ range(wait_for_clusteroperators_retries | int) | list }}"
  loop_control:
    loop_var: wait_for_co_loop_index
    label: "attempt {{ wait_for_co_loop_index + 1 }}"
  when: not (wait_for_co_all_available | bool)

- name: Fail if ClusterOperators not available after timeout
  ansible.builtin.fail:
    msg: >-
      {{ wait_for_co_unavailable | length }} of {{ wait_for_co_total }} ClusterOperators
      not available after {{ wait_for_co_max_retries | int * wait_for_co_delay | int }}s:
      {{ wait_for_co_unavailable | map(attribute='name') | join(', ') }}.
      Details: {{ wait_for_co_unavailable | to_nice_yaml }}
  when: not (wait_for_co_all_available | bool)

- name: Report ClusterOperators status
  ansible.builtin.debug:
    msg: "All {{ wait_for_co_total }} ClusterOperators are available ({{ wait_for_co_attempts }} polls)."
  when: wait_for_co_all_available | bool
