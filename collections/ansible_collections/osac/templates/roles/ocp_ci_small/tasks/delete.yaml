---
# CI cluster template deletion: destroys hosted cluster and releases agents.
# Skips ESI network cleanup (no ESI network to remove).

- name: Override OCP release image from template parameters
  ansible.builtin.set_fact:
    ocp_release_image: "{{ template_parameters.ocp_release_image }}"
  when: template_parameters.ocp_release_image is defined

- name: Destroy hosted cluster
  ansible.builtin.include_role:
    name: osac.service.hosted_cluster
  vars:
    hosted_cluster_state: absent
    hosted_cluster_name: "{{ cluster_order.metadata.name }}"
    hosted_cluster_namespace: "{{ cluster_working_namespace }}"
    hosted_cluster_settings:
      ocp_release_image: "{{ ocp_release_image }}"
      pull_secret: "{{ template_parameters.pull_secret }}"
      ssh_public_key: "{{ template_parameters.ssh_public_key }}"
    hosted_cluster_node_count: >-
      {{ cluster_order.spec.nodeRequests | map(attribute='numberOfNodes') | sum }}

- name: Unlabel agents
  ansible.builtin.include_role:
    name: manage_agents
    tasks_from: detach_and_unlabel_all_removed_agents
  vars:
    manage_agents_cluster_order_name: "{{ cluster_order.metadata.name }}"
